<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <link rel="shortcut icon" type="image/ico" href="assets/favicon.ico" />
    <title>Stremio - Freedom to Stream</title>
    <script>
        (function() {
            var appBuild = '20260710-remote-refresh';
            var streamingServerUrl = 'http://192.168.1.167:11470';
            var localhostServerPattern = /http:\/\/(?:127\.0\.0\.1|localhost):11470\/?/g;
            var debugEndpoint = '/__stremio_debug';

            function normalizeServerUrl(value) {
                return typeof value === 'string' ? value.replace(localhostServerPattern, streamingServerUrl + '/') : value;
            }

            function patchLocalStorage() {
                try {
                    var originalGetItem = Storage.prototype.getItem;
                    var originalSetItem = Storage.prototype.setItem;

                    Storage.prototype.getItem = function(key) {
                        return normalizeServerUrl(originalGetItem.call(this, key));
                    };

                    Storage.prototype.setItem = function(key, value) {
                        return originalSetItem.call(this, key, normalizeServerUrl(value));
                    };

                    for (var i = 0; i < localStorage.length; i += 1) {
                        var key = localStorage.key(i);
                        var value = originalGetItem.call(localStorage, key);
                        var normalized = normalizeServerUrl(value);
                        if (value !== normalized) {
                            originalSetItem.call(localStorage, key, normalized);
                        }
                    }
                } catch (e) {}
            }

            function patchFetch() {
                if (typeof window.fetch !== 'function') return;
                var originalFetch = window.fetch.bind(window);
                window.fetch = function(input, init) {
                    try {
                        if (typeof input === 'string') {
                            input = normalizeServerUrl(input);
                        } else if (input && typeof input.url === 'string') {
                            var normalizedUrl = normalizeServerUrl(input.url);
                            if (normalizedUrl !== input.url) {
                                input = new Request(normalizedUrl, input);
                            }
                        }
                    } catch (e) {}
                    return originalFetch(input, init);
                };
            }

            function force1080ModeFlag() {
                window.screen720p = false;
                try {
                    Object.defineProperty(window, 'screen720p', {
                        configurable: true,
                        get: function() {
                            return false;
                        },
                        set: function() {}
                    });
                } catch (e) {}
            }

            function force1080Layout() {
                force1080ModeFlag();
                try {
                    Object.defineProperty(window, 'innerWidth', {
                        configurable: true,
                        get: function() {
                            return 1920;
                        }
                    });
                    Object.defineProperty(window, 'innerHeight', {
                        configurable: true,
                        get: function() {
                            return 1080;
                        }
                    });
                } catch (e) {}

                try {
                    if (document.head && !document.getElementById('__stremio_global_1080p_fix')) {
                        var style = document.createElement('style');
                        style.id = '__stremio_global_1080p_fix';
                        style.textContent = [
                            'html,body,#root{width:1920px!important;height:1080px!important;min-width:1920px!important;min-height:1080px!important;max-width:1920px!important;max-height:1080px!important;overflow:hidden!important;}',
                            'body{margin:0!important;zoom:44.45%!important;background:#000!important;}',
                            '#root{display:block!important;position:relative!important;}',
                            '.page-jI4PO{width:1920px!important;height:1080px!important;min-width:1920px!important;min-height:1080px!important;max-width:1920px!important;max-height:1080px!important;overflow:hidden!important;}',
                            '.page-jI4PO .inner-DXVjx{height:1080px!important;width:calc(1920px - 10rem)!important;margin-left:10rem!important;overflow:hidden!important;}',
                            '.page-jI4PO.hide-navbar-Q5Bl7 .inner-DXVjx{width:1920px!important;margin-left:0!important;}',
                            '.item-preview-nq13h{height:443px!important;}',
                            '.item-preview-nq13h.item-preview-720p-nskCW{height:680px!important;}',
                            '.item-preview-nq13h .background-container-D9GP9{position:fixed!important;top:0!important;right:0!important;bottom:0!important;left:0!important;width:1920px!important;height:1080px!important;overflow:hidden!important;}',
                            '.item-preview-nq13h .background-container-D9GP9 .background-inner-h_eaj,.item-preview-nq13h .background-container-D9GP9 .background-inner-h_eaj.background-inner-720p-Xc9rr{position:absolute!important;top:0!important;right:0!important;bottom:auto!important;left:0!important;width:1920px!important;height:1080px!important;overflow:hidden!important;}',
                            '.item-preview-nq13h .background-container-D9GP9 .background-inner-h_eaj .background-image-Tlzwm{width:1920px!important;height:1080px!important;min-width:1920px!important;min-height:1080px!important;object-fit:cover!important;object-position:center center!important;}',
                            '.item-preview-nq13h .background-container-D9GP9 .background-inner-h_eaj .gradient-overlay-sYJZ9{width:1920px!important;height:1080px!important;}',
                            '.details-omgjE .info-c3Gsa{height:475px!important;}',
                            '.details-omgjE .info-c3Gsa.info-720p-jPzlb{height:724px!important;}',
                            '.player-SmYw4 .background-image-jHLNn{width:1920px!important;height:1080px!important;}',
                            '.addons-LUJe6 .heading-q2AKI{max-width:1248px!important;}',
                            '.tabs-wr1wR{display:flex!important;visibility:visible!important;}',
                            '.navbar-NNb1c{display:flex!important;visibility:visible!important;}'
                        ].join('\n');
                        document.head.appendChild(style);
                    }

                    [document.documentElement, document.body, document.getElementById('root')].forEach(function(el) {
                        if (!el || !el.style) return;
                        el.style.width = '1920px';
                        el.style.height = '1080px';
                        el.style.minWidth = '1920px';
                        el.style.minHeight = '1080px';
                        el.style.maxWidth = '1920px';
                        el.style.maxHeight = '1080px';
                        el.style.overflow = 'hidden';
                    });

                    if (document.body && document.body.style) {
                        document.body.style.zoom = '44.45%';
                        document.body.style.margin = '0';
                        document.body.style.background = '#000';
                    }
                } catch (e) {}
            }

            function blockQuitEvent() {
                if (window.__stremioQuitBlocked) return;
                window.__stremioQuitBlocked = true;
                try {
                    var originalDispatch = EventTarget.prototype.dispatchEvent;
                    EventTarget.prototype.dispatchEvent = function(event) {
                        try {
                            if (event && event.type === 'quit') {
                                sendViewportDebug('quit-blocked');
                                return true;
                            }
                        } catch (e) {}
                        return originalDispatch.apply(this, arguments);
                    };

                    window.addEventListener('quit', function(event) {
                        try {
                            event.preventDefault();
                            event.stopImmediatePropagation();
                            sendViewportDebug('quit-event-listener-blocked');
                        } catch (e) {}
                    }, true);
                } catch (e) {}
            }

            function getViewportSnapshot(label) {
                var doc = document.documentElement || {};
                var body = document.body || {};
                var vv = window.visualViewport || {};
                var root = document.getElementById('root');
                var rootRect = root && root.getBoundingClientRect ? root.getBoundingClientRect() : null;
                return {
                    label: label,
                    build: appBuild,
                    href: location.href,
                    hash: location.hash,
                    readyState: document.readyState,
                    userAgent: navigator.userAgent || '',
                    screen720p: !!window.screen720p,
                    inner: {
                        width: window.innerWidth || 0,
                        height: window.innerHeight || 0
                    },
                    documentElement: {
                        clientWidth: doc.clientWidth || 0,
                        clientHeight: doc.clientHeight || 0,
                        scrollWidth: doc.scrollWidth || 0,
                        scrollHeight: doc.scrollHeight || 0
                    },
                    body: {
                        clientWidth: body.clientWidth || 0,
                        clientHeight: body.clientHeight || 0,
                        offsetWidth: body.offsetWidth || 0,
                        offsetHeight: body.offsetHeight || 0,
                        scrollWidth: body.scrollWidth || 0,
                        scrollHeight: body.scrollHeight || 0,
                        zoom: body.style ? body.style.zoom || '' : ''
                    },
                    rootRect: rootRect ? {
                        width: Math.round(rootRect.width),
                        height: Math.round(rootRect.height),
                        top: Math.round(rootRect.top),
                        left: Math.round(rootRect.left)
                    } : null,
                    screen: {
                        width: screen.width || 0,
                        height: screen.height || 0,
                        availWidth: screen.availWidth || 0,
                        availHeight: screen.availHeight || 0
                    },
                    visualViewport: {
                        width: vv.width || 0,
                        height: vv.height || 0,
                        scale: vv.scale || 0
                    },
                    devicePixelRatio: window.devicePixelRatio || 0,
                    timestamp: new Date().toISOString()
                };
            }

            function sendViewportDebug(label) {
                var payload;
                try {
                    payload = getViewportSnapshot(label);
                    console.log('[stremio viewport debug]', payload);
                } catch (e) {
                    payload = {
                        label: label,
                        build: appBuild,
                        error: e && e.message ? e.message : String(e)
                    };
                }

                try {
                    var body = JSON.stringify(payload);
                    if (navigator.sendBeacon && navigator.sendBeacon(debugEndpoint, body)) return;
                    if (window.fetch) {
                        fetch(debugEndpoint, {
                            method: 'POST',
                            body: body,
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            keepalive: true
                        }).catch(function() {});
                    }
                } catch (e) {}
            }

            patchLocalStorage();
            patchFetch();
            blockQuitEvent();
            force1080Layout();
            window.__stremioViewportDebug = sendViewportDebug;
            sendViewportDebug('head-init');
            document.addEventListener('DOMContentLoaded', function() {
                force1080Layout();
                sendViewportDebug('domcontentloaded');
            });
            window.addEventListener('load', function() {
                force1080Layout();
                sendViewportDebug('window-load');
                setTimeout(function() {
                    force1080Layout();
                    sendViewportDebug('window-load-plus-1000ms');
                }, 1000);
            });
            window.addEventListener('hashchange', function() {
                force1080Layout();
                sendViewportDebug('hashchange');
            });
        })();
    </script>
    <script defer="defer" src="runtime.js?v=20260710-remote-refresh"></script>
    <script defer="defer" src="main.js?v=20260710-remote-refresh"></script>
    <script defer="defer" src="service.js?v=20260710-remote-refresh"></script>
    <script defer="defer" src="webOSTV.js?v=20260710-remote-refresh"></script>
</head>

<body><noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
</body>
<script>
    try {
        window.top.postMessage(JSON.stringify({
            id: 0,
            scope: 'Status',
            name: 'ready'
        }), '*');
    } catch (e) {}
    window.screen720p = false;
    if (window.__stremioViewportDebug) {
        window.__stremioViewportDebug('after-screen720p-disabled');
    }
</script>

</html>
